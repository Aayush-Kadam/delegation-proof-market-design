name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e '.[test]'
      - run: pytest -q
      - name: Quick theorem check
        run: python -c "from pathlib import Path; from delegation_market.m11_interval import certify; certify(Path('/tmp/m11-quick.json'), parts=50)"
      - name: Build manuscript and checksums
        run: python scripts/build_release_artifacts.py
      - name: Source sanity
        run: python scripts/check_release_sanity.py
