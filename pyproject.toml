[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delegation-proof-market-design"
version = "1.1.1"
description = "Reproducible laboratory for repeated auctions populated by adaptive bidding agents"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "matplotlib>=3.8,<4", "pyyaml>=6,<7", "reportlab>=4.4,<5"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40,<2", "plotly>=5.20,<7"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
